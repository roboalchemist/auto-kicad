[project]
name = "kicad-harness"
version = "0.1.0"
description = "Agent harness for KiCad PCB design with a live, reviewable, versioned loop"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Joseph Schlesinger" }]
dependencies = [
    "pydantic-ai-slim[ag-ui,anthropic]==2.60.0",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.50",
    "typer>=0.15",
    "httpx>=0.27",
    "shapely>=2.0",
    "cairosvg>=2.7",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Any model pydantic-ai can reach through the OpenAI-compatible provider
# (openai:...), e.g. OpenRouter: HARNESS_MODEL=openai:anthropic/claude-sonnet-5
# with OPENAI_BASE_URL=https://openrouter.ai/api/v1.
openai = ["openai>=1.40"]
# google:... models, e.g. HARNESS_MODEL=google:gemini-3.1-pro-preview with GEMINI_API_KEY
google = ["google-genai>=1.0"]

[project.urls]
Homepage = "https://github.com/roboalchemist/kicad-agent"
Repository = "https://github.com/roboalchemist/kicad-agent"
Issues = "https://github.com/roboalchemist/kicad-agent/issues"

[project.scripts]
kicad-harness = "kicad_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kicad_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: needs network access and ANTHROPIC_API_KEY",
    "slow: takes more than a few seconds",
]
